title: Screenshots
tagline: Open Source Design Inspiration
description: A GitHub Pages screenshot gallery.
url: https://screenshots.designknowledgebase.com
project_url: https://github.com/joesteinkamp/screenshots-design-inspiration

permalink: pretty

# The platform taxonomy — the single source of truth for it.
#
# A platform IS a top-level directory: `<Platform>/<Product>/index.html`. This
# list is what the nav, the filter chips, the Ruby generators, the Node scripts
# and the upload UI all read, so adding or renaming a platform means editing
# this list and moving the directory — nothing else.
#
# Order is display order (nav, landing-page cards, filter chips).
platforms:
  - Email
  - Mobile
  - Web

# Force UTF-8 reads of source files regardless of the host locale. Without
# this, Ruby falls back to US-ASCII when LANG is unset and kramdown rejects
# any non-ASCII byte in page content (em-dashes, Unicode filename chars,
# etc.) with "Encoding::UndefinedConversionError".
encoding: utf-8

google_analytics: UA-8657893-8
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag



tag_page: '/tags/'

exclude:
  - "*/tags.json"
  - scripts/
  - node_modules/
  - _build_warnings.json
  - package.json
  - package-lock.json