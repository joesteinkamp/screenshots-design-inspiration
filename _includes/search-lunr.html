<script src="/assets/js/lunr.js"></script>

<script>
{% assign counter = 0 %}
var documents = [{% for page in site.pages %}{% if page.url contains '.xml' or page.url contains 'assets' %}{% else %}{
    "id": {{ counter }},
    "url": "{{ site.url }}{{ page.url }}",
    "title": "{{ page.title }}",
    "gallery-directory": "{{ page.gallery-directory }}",
    "tags": "{{ page.tags | join: ' ' }}",
    "body": "{{ page.content | markdownify | replace: '.', '. ' | replace: '</h2>', ': ' | replace: '</h3>', ': ' | replace: '</h4>', ': ' | replace: '</p>', ' ' | strip_html | strip_newlines | replace: '  ', ' ' | replace: '"', ' ' }}"{% assign counter = counter | plus: 1 %}
    }, {% endif %}{% endfor %}{% for page in site.without-plugin %}{
    "id": {{ counter }},
    "url": "{{ site.url }}{{ page.url }}",
    "title": "{{ page.title }}",
    "gallery-directory": "{{ page.gallery-directory }}",
    "tags": "{{ page.tags | jsonify }}",
    "body": "{{ page.content | markdownify | replace: '.', '. ' | replace: '</h2>', ': ' | replace: '</h3>', ': ' | replace: '</h4>', ': ' | replace: '</p>', ' ' | strip_html | strip_newlines | replace: '  ', ' ' | replace: '"', ' ' }}"{% assign counter = counter | plus: 1 %}
    }, {% endfor %}{% for page in site.posts %}{
    "id": {{ counter }},
    "url": "{{ site.url }}{{ page.url }}",
    "title": "{{ page.title }}",
    "gallery-directory": "{{ page.gallery-directory }}",
    "tags": "{{ page.tags | jsonify }}",
    "body": "{{ page.date | date: "%Y/%m/%d" }} - {{ page.content | markdownify | replace: '.', '. ' | replace: '</h2>', ': ' | replace: '</h3>', ': ' | replace: '</h4>', ': ' | replace: '</p>', ' ' | strip_html | strip_newlines | replace: '  ', ' ' | replace: '"', ' ' }}"{% assign counter = counter | plus: 1 %}
    }{% if forloop.last %}{% else %}, {% endif %}{% endfor %}];

console.log(documents);

var idx = lunr(function () {
    this.ref('id')
    this.field('title')
    this.field('gallery-directory')
    this.field('tags')
    this.field('body')

    documents.forEach(function (doc) {
        this.add(doc)
    }, this)
});
function lunr_search(term) {
    document.getElementById('lunrsearchresults').innerHTML = '<ul></ul>';
    if(term) {
        document.getElementById('lunrsearchresults').innerHTML = "<p>Search results for '" + term + "'</p>" + document.getElementById('lunrsearchresults').innerHTML;
        //put results on the screen.
        var results = idx.search(term);
        if(results.length>0){
            // console.log(results);
            //if results
            for (var i = 0; i < results.length; i++) {
                // more statements
                var ref = results[i]['ref'];
                var url = documents[ref]['url'];
                var title = documents[ref]['title'];
                var gallerydirectory = documents[ref]['gallery-directory'];
                var tags = documents[ref]['tags'];
                // console.log(tags);
                var body = documents[ref]['body'].substring(0,160)+'...';
                document.querySelectorAll('#lunrsearchresults ul')[0].innerHTML = document.querySelectorAll('#lunrsearchresults ul')[0].innerHTML + "<li class='lunrsearchresult'><a href='" + url + "'><span class='title'>" + gallerydirectory + "</span><span class='url'>"+ url +"</span><span class='body'>"+ body +"</span><span class='tags'>"+ tags +"</span></a></li>";
            }
        } else {
            document.querySelectorAll('#lunrsearchresults ul')[0].innerHTML = "<li class='lunrsearchresult'>No results found...</li>";
        }
    }
    return false;
}
</script>
<style>
    /* Search Form Container */
    form p {
        display: flex;
        gap: 0;
        max-width: 600px;
        margin-bottom: 2rem;
    }

    /* Input Field */
    #lunrsearch {
        font-family: var(--font-family, sans-serif);
        font-size: 16px;
        padding: 16px 24px;
        width: 100%;
        margin: 0;
        -webkit-appearance: none;
        background: var(--surface-color, #171717);
        border: 1px solid rgba(255,255,255,0.1);
        border-right: 0;
        border-radius: var(--radius-md, 12px) 0 0 var(--radius-md, 12px);
        color: var(--text-primary, #ffffff);
        transition: all 0.2s ease;
    }
    
    #lunrsearch::placeholder {
        color: var(--text-secondary, #a1a1aa);
    }

    #lunrsearch:focus {
        outline: none;
        background: var(--surface-highlight, #262626);
        border-color: var(--primary-color, #6366f1);
        position: relative;
        z-index: 2;
    }

    /* Submit Button */
    #lunrsearchsubmit {
        -webkit-appearance: none;
        padding: 16px 32px;
        background: var(--primary-color, #6366f1);
        border: 1px solid var(--primary-color, #6366f1);
        border-radius: 0 var(--radius-md, 12px) var(--radius-md, 12px) 0;
        font-family: var(--font-family, sans-serif);
        font-size: 16px;
        color: #fff;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s ease;
    }

    #lunrsearchsubmit:hover {
        background: var(--primary-hover, #4f46e5);
        box-shadow: 0 0 15px rgba(99, 102, 241, 0.4);
    }

    /* Results Container */
    #lunrsearchresults {
        margin-top: 32px;
    }

    #lunrsearchresults p {
        color: var(--text-secondary, #a1a1aa);
        font-size: 1.1em;
        margin-bottom: 24px;
    }

    #lunrsearchresults ul {
        list-style: none;
        padding: 0;
        display: grid;
        gap: 16px; 
    }

    /* Individual Result Item */
    .lunrsearchresult {
        background: var(--surface-color, #171717);
        border: 1px solid rgba(255,255,255,0.05);
        border-radius: var(--radius-md, 12px);
        padding: 24px;
        transition: transform 0.2s, background 0.2s, border-color 0.2s;
        margin-bottom: 0;
    }

    .lunrsearchresult:hover {
        transform: translateY(-2px);
        background: var(--surface-highlight, #262626);
        border-color: rgba(99, 102, 241, 0.3);
        box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    }

    .lunrsearchresult a {
        display: block;
        text-decoration: none;
        color: inherit;
    }

    /* Result Title */
    .lunrsearchresult .title {
        color: var(--text-primary, #ffffff);
        font-size: 1.25rem;
        font-weight: 600;
        display: block;
        margin-bottom: 8px;
        transition: color 0.2s;
    }

    .lunrsearchresult:hover .title {
        color: var(--primary-color, #6366f1);
    }

    /* Result URL */
    .lunrsearchresult .url {
        color: var(--text-secondary, #a1a1aa);
        font-size: 0.85em;
        display: block;
        margin-bottom: 12px;
        font-family: monospace;
        opacity: 0.5;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    /* Result Body Snippet */
    .lunrsearchresult .body {
        color: var(--text-secondary, #a1a1aa);
        font-size: 0.95em;
        line-height: 1.6;
        display: block;
        opacity: 0.9;
    }
    
    /* Result Tags */
    .lunrsearchresult .tags {
        display: inline-block;
        margin-top: 16px;
        font-size: 0.75em;
        color: var(--primary-color, #6366f1);
        background: rgba(99, 102, 241, 0.1);
        padding: 4px 10px;
        border-radius: 100px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        font-weight: 600;
    }
</style>


<form onSubmit="return lunr_search(document.getElementById('lunrsearch').value);">
    <p><input type="text" class="form-control" id="lunrsearch" name="q" maxlength="255" value="" placeholder="Search..." /><input type="submit" value="Go" id="lunrsearchsubmit" /></p>
</form>
<div id="lunrsearchresults">
    <ul></ul>
</div>
