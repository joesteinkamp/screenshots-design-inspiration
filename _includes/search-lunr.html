<script src="/assets/js/lunr.js"></script>

<script>
var documents = [];
var idx = null;
var indexReady = false;
var pendingQuery = null;

function renderResults(term, results) {
    var container = document.querySelectorAll('#lunrsearchresults ul')[0];
    if (!container) { return; }
    container.innerHTML = '';
    if (results.length === 0) {
        container.innerHTML = "<li class='lunrsearchresult'>No results found...</li>";
        return;
    }
    for (var i = 0; i < results.length; i++) {
        var ref = results[i]['ref'];
        var doc = documents[ref];
        if (!doc) { continue; }
        var url = doc['url'];
        var title = doc['title'];
        var gallerydirectory = doc['gallery-directory'];
        var body = doc['body'];

        var displayTitle = gallerydirectory ? gallerydirectory : title;

        var bodyHtml = '';
        if (!gallerydirectory && body && body.trim().length > 0) {
            var bodyTruncated = body.substring(0, 160) + (body.length > 160 ? '...' : '');
            bodyHtml = "<span class='body'>" + bodyTruncated + "</span>";
        }

        var tags = doc['tags'];
        var tagsHtml = '';
        if (tags && Array.isArray(tags) && tags.length > 0) {
            tagsHtml = "<div class='tags-container'>";
            for (var t = 0; t < tags.length; t++) {
                if (tags[t] && String(tags[t]).trim().length > 0) {
                    tagsHtml += "<span class='tag'>" + tags[t] + "</span>";
                }
            }
            tagsHtml += "</div>";
        }

        container.innerHTML += "<li class='lunrsearchresult'><a href='" + url + "'><span class='title'>" + displayTitle + "</span><span class='url'>" + url + "</span>" + bodyHtml + tagsHtml + "</a></li>";
    }
}

function lunr_search(term) {
    var resultsContainer = document.getElementById('lunrsearchresults');
    if (resultsContainer) {
        resultsContainer.innerHTML = "<p>Search results for '" + term + "'</p><ul></ul>";
    }
    if (!term) { return false; }

    var newUrl = window.location.pathname + '?q=' + encodeURIComponent(term);
    history.replaceState(null, '', newUrl);

    if (!indexReady) {
        pendingQuery = term;
        var ul = document.querySelectorAll('#lunrsearchresults ul')[0];
        if (ul) { ul.innerHTML = "<li class='lunrsearchresult'>Loading index...</li>"; }
        return false;
    }

    renderResults(term, idx.search(term));
    return false;
}

function buildIndex(docs) {
    documents = docs;
    idx = lunr(function () {
        this.ref('id');
        this.field('title');
        this.field('gallery-directory');
        this.field('tags');
        this.field('image_tags');
        this.field('body');
        var self = this;
        documents.forEach(function (doc) {
            // Tags come through as an array — Lunr expects strings per field,
            // so collapse to space-joined form just for indexing.
            var indexable = {
                id: doc.id,
                title: doc.title,
                'gallery-directory': doc['gallery-directory'],
                tags: Array.isArray(doc.tags) ? doc.tags.join(' ') : (doc.tags || ''),
                image_tags: doc.image_tags || '',
                body: doc.body || ''
            };
            self.add(indexable);
        });
    });
    indexReady = true;
    if (pendingQuery) {
        var q = pendingQuery;
        pendingQuery = null;
        renderResults(q, idx.search(q));
    }
}

document.addEventListener('DOMContentLoaded', function () {
    fetch('/assets/js/search-data.json')
        .then(function (r) { return r.json(); })
        .then(function (docs) { buildIndex(docs); })
        .catch(function (err) {
            console.error('Failed to load search index:', err);
            var ul = document.querySelectorAll('#lunrsearchresults ul')[0];
            if (ul) { ul.innerHTML = "<li class='lunrsearchresult'>Search index failed to load.</li>"; }
        });

    var params = new URLSearchParams(window.location.search);
    var q = params.get('q');
    if (q) {
        var input = document.getElementById('lunrsearch');
        if (input) { input.value = q; }
        lunr_search(q);
    }
});
</script>
<style>
    /* Search Form Container */
    form p {
        display: flex;
        gap: 0;
        max-width: 600px;
        margin-bottom: 2rem;
    }

    /* Input Field */
    #lunrsearch {
        font-family: var(--font-family, sans-serif);
        font-size: 16px;
        padding: 16px 24px;
        width: 100%;
        margin: 0;
        -webkit-appearance: none;
        background: var(--surface-color, #171717);
        border: 1px solid rgba(255,255,255,0.1);
        border-right: 0;
        border-radius: var(--radius-md, 12px) 0 0 var(--radius-md, 12px);
        color: var(--text-primary, #ffffff);
        transition: all 0.2s ease;
    }

    #lunrsearch::placeholder {
        color: var(--text-secondary, #a1a1aa);
    }

    #lunrsearch:focus {
        outline: none;
        background: var(--surface-highlight, #262626);
        border-color: var(--primary-color, #6366f1);
        position: relative;
        z-index: 2;
    }

    /* Submit Button */
    #lunrsearchsubmit {
        -webkit-appearance: none;
        padding: 16px 32px;
        background: var(--primary-color, #6366f1);
        border: 1px solid var(--primary-color, #6366f1);
        border-radius: 0 var(--radius-md, 12px) var(--radius-md, 12px) 0;
        font-family: var(--font-family, sans-serif);
        font-size: 16px;
        color: #fff;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s ease;
    }

    #lunrsearchsubmit:hover {
        background: var(--primary-hover, #4f46e5);
        box-shadow: 0 0 15px rgba(99, 102, 241, 0.4);
    }

    /* Results Container */
    #lunrsearchresults {
        margin-top: 32px;
    }

    #lunrsearchresults p {
        color: var(--text-secondary, #a1a1aa);
        font-size: 1.1em;
        margin-bottom: 24px;
    }

    #lunrsearchresults ul {
        list-style: none;
        padding: 0;
        display: grid;
        gap: 16px;
    }

    /* Individual Result Item */
    .lunrsearchresult {
        background: var(--surface-color, #171717);
        border: 1px solid rgba(255,255,255,0.05);
        border-radius: var(--radius-md, 12px);
        padding: 24px;
        transition: transform 0.2s, background 0.2s, border-color 0.2s;
        margin-bottom: 0;
    }

    .lunrsearchresult:hover {
        transform: translateY(-2px);
        background: var(--surface-highlight, #262626);
        border-color: rgba(99, 102, 241, 0.3);
        box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    }

    .lunrsearchresult a {
        display: block;
        text-decoration: none;
        color: inherit;
    }

    /* Result Title */
    .lunrsearchresult .title {
        color: var(--text-primary, #ffffff);
        font-size: 1.25rem;
        font-weight: 600;
        display: block;
        margin-bottom: 8px;
        transition: color 0.2s;
    }

    .lunrsearchresult:hover .title {
        color: var(--primary-color, #6366f1);
    }

    /* Result URL */
    .lunrsearchresult .url {
        color: var(--text-secondary, #a1a1aa);
        font-size: 0.85em;
        display: block;
        margin-bottom: 12px;
        font-family: monospace;
        opacity: 0.5;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    /* Result Body Snippet */
    .lunrsearchresult .body {
        color: var(--text-secondary, #a1a1aa);
        font-size: 0.95em;
        line-height: 1.6;
        display: block;
        opacity: 0.9;
    }

    /* Result Tags */
    .lunrsearchresult .tags-container {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 16px;
    }

    .lunrsearchresult .tag {
        display: inline-block;
        font-size: 0.75em;
        color: var(--primary-color, #6366f1);
        background: rgba(99, 102, 241, 0.1);
        padding: 4px 10px;
        border-radius: 100px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        font-weight: 600;
    }
</style>


<form onSubmit="return lunr_search(document.getElementById('lunrsearch').value);">
    <p><input type="text" class="form-control" id="lunrsearch" name="q" maxlength="255" value="" placeholder="Search..." /><input type="submit" value="Go" id="lunrsearchsubmit" /></p>
</form>
<div id="lunrsearchresults">
    <ul></ul>
</div>
