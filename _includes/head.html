<!DOCTYPE html>
<html lang="{{ site.lang | default: " en-US" }}">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  {% seo %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="icon" type="image/png" href="/assets/img/favicon.png">
  <!--[if lt IE 9]>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5shiv/3.7.3/html5shiv.min.js"></script>
    <![endif]-->
  <link rel="stylesheet" href="/assets/grid-gallery/grid-gallery.css">
</head>

<body>
  <div class="wrapper">
    <header>
      <div class="container">
        <div class="col">
          {% if site.logo %}
            <img src="{{site.logo | relative_url}}" alt="Logo" />
          {% endif %}

          <h1><a href="{{ "/" | absolute_url }}">{{ site.title | default: site.github.repository_name }}</a></h1>
          
        </div>

        <div class="col">
          <ul class="menu">
            <li><a class="search" href="{{ "search" | relative_url}}"><img src="{{ "assets/img/icon-search.svg" | relative_url}}" /></a></li>
            <li><a href="{{ "Email/" | relative_url}}">Email</a></li>
            <li><a href="{{ "Mobile/" | relative_url}}">Mobile</a></li>
            <li><a href="{{ "Web/" | relative_url}}">Web</a></li>
          </ul>
        </div>
      </div>

    </header>
