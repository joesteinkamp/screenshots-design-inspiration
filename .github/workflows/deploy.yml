name: Deploy Jekyll site to Pages

on:
  push:
    branches: ["master", "main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

# Screenshot auto-tagging deliberately does NOT happen here — it runs a vision
# model at roughly a minute per image, which blocked publishing for hours and
# blew past the job time limit once the backlog grew. It lives in tag.yml on
# its own schedule; its commits land on master and trigger this workflow
# normally. See .github/workflows/tag.yml.

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      # Repair any YAML typos — contributors' own, or any our auto-tagger
      # may have introduced. Exit code 2 just means fixes were applied; exit
      # code 1 means unfixable errors remain (the safety-net plugin will
      # still render those products so the build succeeds, but we log it).
      - name: Auto-fix frontmatter YAML
        run: |
          set +e
          node scripts/validate-frontmatter.mjs --fix
          code=$?
          if [ "$code" -eq 1 ]; then
            echo "::warning::validate-frontmatter found unfixable YAML errors. The safety-net plugin will fall back to minimal frontmatter so the build continues."
          fi
          exit 0

      # [skip ci] so the fix commit does not re-trigger this workflow; the
      # fixes publish with whatever push comes next. [skip-recency] keeps a
      # YAML repair from re-dating an old gallery as "recently added".
      - name: Commit bot updates (YAML fixes)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "*/index.html" "*/tags.json"
          if git diff --cached --quiet; then
            echo "No frontmatter fixes to commit."
            exit 0
          fi
          git commit -m "chore(bot): auto-fix frontmatter [skip ci] [skip-recency]"
          git push

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '2.6' # Matches local Gemfile constraints
          bundler-cache: true

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Build with Jekyll
        # --verbose + --trace stream per-file progress and full backtraces so a
        # stalled build is obvious from the live CI log; the _plugins/build_progress.rb
        # plugin adds phase timings and a render heartbeat on top of that.
        run: bundle exec jekyll build --verbose --trace --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
