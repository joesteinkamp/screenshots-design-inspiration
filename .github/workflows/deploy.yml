name: Deploy Jekyll site to Pages

on:
  push:
    branches: ["master", "main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  TAGGER_MODEL_FILE: Qwen2.5-VL-7B-Instruct-Q4_K_M.gguf
  TAGGER_MMPROJ_FILE: mmproj-Qwen2.5-VL-7B-Instruct-f16.gguf
  TAGGER_MODEL_REPO: ggml-org/Qwen2.5-VL-7B-Instruct-GGUF
  LLAMA_SERVER_IMAGE: ghcr.io/ggml-org/llama.cpp:server
  LLAMA_CTX_SIZE: "16384"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Cache tagger model weights
        id: cache-model
        uses: actions/cache@v5
        with:
          path: scripts/.models
          key: tagger-model-${{ env.TAGGER_MODEL_REPO }}-${{ env.TAGGER_MODEL_FILE }}-${{ env.TAGGER_MMPROJ_FILE }}

      - name: Download tagger model weights
        if: steps.cache-model.outputs.cache-hit != 'true'
        run: scripts/download-tagger-model.sh

      - name: Pull llama.cpp server image
        run: docker pull "$LLAMA_SERVER_IMAGE"

      - name: Start local tagger
        run: scripts/start-local-tagger.sh --detach

      - name: Auto-tag untagged screenshots
        run: node scripts/auto-tag.mjs --backend local --no-limit

      - name: Stop local tagger
        if: always()
        run: scripts/stop-local-tagger.sh

      # Repair any YAML typos — contributors' own, or any our auto-tagger
      # may have introduced. Exit code 2 just means fixes were applied; exit
      # code 1 means unfixable errors remain (the safety-net plugin will
      # still render those products so the build succeeds, but we log it).
      - name: Auto-fix frontmatter YAML
        run: |
          set +e
          node scripts/validate-frontmatter.mjs --fix
          code=$?
          if [ "$code" -eq 1 ]; then
            echo "::warning::validate-frontmatter found unfixable YAML errors. The safety-net plugin will fall back to minimal frontmatter so the build continues."
          fi
          exit 0

      - name: Commit bot updates (auto-tags + YAML fixes)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet && exit 0
          git add "*/index.html" "*/tags.json"
          git commit -m "chore(bot): auto-tag + auto-fix frontmatter [skip ci]"
          git push

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '2.6' # Matches local Gemfile constraints
          bundler-cache: true

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Build with Jekyll
        # check for bundler version just in case, but usually bundler-cache handles it
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
